  - id: module-020
    title: "Platform Automation With Operators"
    description: >
      The reader learns what makes a custom resource do something:
      a controller running a reconcile loop. Using the Prometheus
      Operator, an operator from the CNPE tool list, the reader
      follows a `Prometheus` custom resource to the StatefulSet,
      Service and Secrets it creates, reads status conditions and
      observedGeneration, and sees how finalizers and owner
      references control deletion. It sits after CRDs because it
      reads the status and subresources defined there, and before
      Crossplane because Crossplane is itself a set of operators.

