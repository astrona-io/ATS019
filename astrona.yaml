# Course manifest for ATS019 - Platform APIs and Self-Service Capabilities
# (Certified Cloud Native Platform Engineer).
#
# One entry per section under `modules:`. Each section lists, in order: its
# README, then for each module the landing page (course.md), its parts
# (course-0N-*.md), and right after the part a lab tests, the lab's
# question.md reading and the `type: lab` entry. The module's wrap-up page
# comes last. The section capstone closes the section. Playgrounds are not
# listed: the landing page's playground marker shows them. solution.md is
# never listed.
#
# Every `path:` is relative to this file.

training:
  id: ATS019
  title: "CNPE: Platform APIs and Self-Service Capabilities"
  description: >
    Training material covering the Certified Cloud Native Platform Engineer
    (CNPE) Platform APIs and Self-Service Capabilities domain: designing
    CustomResourceDefinitions with OpenAPI schemas, CEL validation rules,
    printer columns, versions and subresources; reading an operator's
    reconcile loop through status conditions, finalizers and owner
    references; building platform APIs with Crossplane composite resource
    definitions, compositions, functions and providers; and offering
    self-service provisioning with Argo Workflows, Argo Events, Git requests
    and RBAC scoped to the platform API. Each module pairs a layered reader
    with an ungraded hands-on playground. Each section closes with an
    integration capstone.
    Built and verified against Kubernetes 1.35, Crossplane 2.4.2 and
    Argo Workflows 4.1.5.

  certification:
    name: Certified Cloud Native Platform Engineer
    code: CNPE
    provider: CNCF / Linux Foundation
    domain: Platform APIs and Self-Service Capabilities
    weight: 25
    competencies:
      - "Designing and Creating Custom Resource Definitions (CRDs) for Platform Services"
      - "Implementing Workflows for Self-Service Provisioning Using Platform APIs"
      - "Using Kubernetes Operators for Platform Automation and Integration"
      - "Using Automation Frameworks for Self-Service Provisioning"

modules:

  - id: module-intro
    title: "Introduction"
    description: >
      Start here. What this course trains you to do, how it is laid out, how
      to get your machine ready with the astrona command-line tool, how the
      content is written and checked, who maintains it, and how to report a
      mistake.

    content:
      - type: reading
        title: Introduction
        path: sections/intro/README.md
      - type: reading
        title: "Welcome To The Course"
        path: sections/intro/course-01-welcome.md
      - type: reading
        title: "Get Your Machine Ready"
        path: sections/intro/course-02-get-your-machine-ready.md
      - type: reading
        title: "How This Course Is Made"
        path: sections/intro/course-03-how-this-course-is-made.md

  - id: module-010
    title: "Extending The Kubernetes API With CRDs"
    description: >
      The reader designs a platform service as a new Kubernetes resource
      type. First the schema that makes the API server type, default,
      prune and reject input, then versions and subresources so the API
      can evolve and a controller can report status. It comes first
      because every later section (operators, Crossplane, self-service)
      is built on custom resources and reads their schema and status.

    content:
      - type: reading
        title: Section Overview
        path: sections/section-010/README.md

      - type: reading
        title: "Design A CRD Schema That Validates Input"
        path: sections/section-010/module-01/course.md
      - type: reading
        title: "What A CRD Adds To The API Server"
        path: sections/section-010/module-01/course-01-what-a-crd-adds.md
      - type: reading
        title: "Types, Required Fields, Defaults And Pruning"
        path: sections/section-010/module-01/course-02-types-defaults-and-pruning.md
      - type: reading
        title: "Rules Across Fields With CEL"
        path: sections/section-010/module-01/course-03-cel-rules.md
      - type: reading
        title: "Printer Columns, Short Names And Categories"
        path: sections/section-010/module-01/course-04-printer-columns-and-names.md
      - type: reading
        title: Summary
        path: sections/section-010/module-01/course-05-summary.md
