# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Manage Deletion With Finalizers And Owner References (PLAYGROUND) —
# playground environment. A clean sandbox: it installs the Prometheus
# Operator with one `Prometheus` resource that owns its objects, a ConfigMap
# with a finalizer, a suspended cleanup Job, and the TeamEnvironment CRD.
# No task, no grading, no `astrona submit`.
apiVersion: astrona.io/v1
metadata:
  name: ats-019-playground-020-02
  docs:
    guide: docs/overview.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - quay.io/prometheus-operator/prometheus-operator:v0.94.1
      - quay.io/prometheus-operator/prometheus-config-reloader:v0.94.1
      - quay.io/prometheus/prometheus:v3.15.0-distroless
      - registry.k8s.io/kubectl:v1.35.8

bootstrap:
  manifests:
    - name: lab-start
      type: file
      source: manifests/lab-start.yaml
    - name: cleanup-worker
      type: file
      source: manifests/cleanup-worker.yaml
  init:
    - name: install-operator
      description: "Installs the Prometheus Operator 0.94.1 from its bundle and waits for it"
      type: file
      source: bootstrap/01-install-operator.sh
  waitFor:
    - resource: deploy/prometheus-operator
      namespace: default
    - resource: prometheus/starfleet
      namespace: starfleet
      condition: Available
      timeout: 240s

teardown:
  keepCluster: false
