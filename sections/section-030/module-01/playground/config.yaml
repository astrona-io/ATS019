# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Install A Crossplane Provider And ProviderConfig (PLAYGROUND) — playground
# environment. A clean sandbox: Crossplane 2.4.2 is running, no provider is
# installed. No task, no grading, no `astrona submit`. Needs outbound
# internet: Crossplane pulls packages from xpkg.crossplane.io.
apiVersion: astrona.io/v1
metadata:
  name: ats-019-playground-030-01
  docs:
    guide: docs/overview.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - xpkg.crossplane.io/crossplane/crossplane:v2.4.2

bootstrap:
  init:
    - name: install-crossplane
      description: "Installs Crossplane 2.4.2 in crossplane-system and waits for its CRDs"
      type: file
      source: bootstrap/01-install-crossplane.sh

teardown:
  keepCluster: false
