apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: starfleet-compose-statefulsets
  labels:
    rbac.crossplane.io/aggregate-to-crossplane: 'true'
rules:
  - apiGroups:
      - apps
    resources:
      - statefulsets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
