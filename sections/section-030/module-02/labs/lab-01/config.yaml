# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Define A Platform API With An XRD Lab — Crossplane 2.4.2, provider-kubernetes
# 1.4.1 and function-patch-and-transform 0.11.0 are installed. No XRD exists.
# The learner defines the ProbeEnvironment API. Needs outbound internet.
apiVersion: astrona.io/v1
metadata:
  name: ats-019-lab-030-02
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - xpkg.crossplane.io/crossplane/crossplane:v2.4.2

bootstrap:
  init:
    - name: install-crossplane
      description: "Installs Crossplane 2.4.2 in crossplane-system and waits for its CRDs"
      type: file
      source: bootstrap/01-install-crossplane.sh
    - name: install-packages
      description: "Installs the provider and the function, then the ClusterProviderConfig and RBAC"
      type: file
      source: bootstrap/02-install-packages.sh
  waitFor:
    - resource: provider.pkg.crossplane.io/provider-kubernetes
      condition: Healthy
      timeout: 300s
    - resource: function.pkg.crossplane.io/function-patch-and-transform
      condition: Healthy
      timeout: 300s

testing:
  init:
    - name: reference-solution
      description: "Applies the reference XRD and request (astrona test only)"
      type: file
      source: solution/apply.sh
    - name: wait-established
      description: "Waits for the generated CRD and the stored request"
      type: file
      source: testing/01-wait-established.sh

validation:
  scripts:
    - name: xrd-definition
      type: file
      source: validation/validate-xrd-definition.sh
    - name: valid-request-defaults
      type: file
      source: validation/validate-valid-request-defaults.sh
    - name: invalid-requests-refused
      type: file
      source: validation/validate-invalid-requests-refused.sh
    - name: stored-request
      type: file
      source: validation/validate-stored-request.sh

teardown:
  keepCluster: false
