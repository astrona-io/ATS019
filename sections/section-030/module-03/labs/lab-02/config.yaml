# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Fix A Failing Composition Found By Tracing (LAB). Graded against the live cluster. Needs outbound
# internet: Crossplane pulls providers and functions from xpkg.crossplane.io.
apiVersion: astrona.io/v1
metadata:
  name: ats-019-lab-030-03-02
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - xpkg.crossplane.io/crossplane/crossplane:v2.4.2
      - ghcr.io/stefanprodan/podinfo:6.15.0

bootstrap:
  init:
    - name: install-crossplane
      description: "Installs Crossplane 2.4.2 in crossplane-system and waits for its CRDs"
      type: file
      source: bootstrap/01-install-crossplane.sh
    - name: install-platform-api
      description: "Installs provider-kubernetes, the function, the ProviderConfig, its RBAC and the TeamEnvironment XRD"
      type: file
      source: bootstrap/02-install-platform-api.sh
    - name: install-crossplane-cli
      description: "Downloads the crossplane CLI 2.4.1 into the lab work folder"
      type: file
      source: bootstrap/03-install-crossplane-cli.sh
  manifests:
    - name: shuttle
      type: file
      source: manifests/shuttle.yaml
    - name: composition-teamenvironment
      description: "The Composition with two faults"
      type: file
      source: manifests/composition-teamenvironment.yaml
    - name: teamenvironment-scout-env
      description: "The tenant request that never becomes ready"
      type: file
      source: manifests/teamenvironment-scout-env.yaml
  waitFor:
    - resource: deployment/shuttle
      namespace: outpost
      condition: Available
      timeout: 180s

testing:
  init:
    - name: verify-unfinished-state
      description: Require a ready API and an explicit grader rejection before solving
      type: file
      source: testing/verify-start.sh
      timeout: 10m
    - name: solution
      description: "Reference solution applied by astrona test"
      type: file
      source: solution/apply.sh

validation:
  passPercent: 100
  scripts:
    - name: composition
      description: "The Composition itself is fixed and still patches replicas"
      type: file
      source: validation/validate-composition.sh
      points: 25
    - name: request-ready
      description: "The original request is unchanged, Synced and Ready"
      type: file
      source: validation/validate-request-ready.sh
      points: 25
    - name: workload-follows-request
      description: "The Deployment runs the requested number of replicas"
      type: file
      source: validation/validate-workload-follows-request.sh
      points: 30
    - name: answers
      description: "scout answers 200 to a request from shuttle"
      type: file
      source: validation/validate-workload-answers.sh
      points: 10
    - name: no-shortcuts
      description: "No extra ProviderConfig, no widened RBAC, no hand-made objects"
      type: file
      source: validation/validate-no-shortcuts.sh
      points: 10

teardown:
  keepCluster: false
