# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Delete A Composite Resource Without Losing Its Workload (LAB). Graded against the live cluster. Needs outbound
# internet: Crossplane pulls providers and functions from xpkg.crossplane.io.
apiVersion: astrona.io/v1
metadata:
  name: ats-019-lab-030-03-03
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - xpkg.crossplane.io/crossplane/crossplane:v2.4.2
      - ghcr.io/stefanprodan/podinfo:6.15.0

bootstrap:
  init:
    - name: install-crossplane
      description: "Installs Crossplane 2.4.2 in crossplane-system and waits for its CRDs"
      type: file
      source: bootstrap/01-install-crossplane.sh
    - name: install-platform-api
      description: "Installs provider-kubernetes, the function, the ProviderConfig, its RBAC and the TeamEnvironment XRD"
      type: file
      source: bootstrap/02-install-platform-api.sh
    - name: install-crossplane-cli
      description: "Downloads the crossplane CLI 2.4.1 into the lab work folder"
      type: file
      source: bootstrap/03-install-crossplane-cli.sh
    - name: seed-request
      description: "Creates a ready scout-env request and records the UIDs of what it created"
      type: file
      source: bootstrap/04-seed-request.sh
  waitFor:
    - resource: deployment/shuttle
      namespace: outpost
      condition: Available
      timeout: 180s

testing:
  init:
    - name: solution
      description: "Reference solution applied by astrona test"
      type: file
      source: solution/apply.sh

validation:
  passPercent: 100
  scripts:
    - name: request-gone
      description: "The TeamEnvironment scout-env is gone"
      type: file
      source: validation/validate-request-gone.sh
      points: 25
    - name: workload-kept
      description: "The original scout Deployment and Service still exist"
      type: file
      source: validation/validate-workload-kept.sh
      points: 30
    - name: objects-orphaned
      description: "The original Object resources remain and no composite resource owns them"
      type: file
      source: validation/validate-objects-orphaned.sh
      points: 25
    - name: answers
      description: "scout answers 200 to a request from shuttle"
      type: file
      source: validation/validate-workload-answers.sh
      points: 20

teardown:
  keepCluster: false
