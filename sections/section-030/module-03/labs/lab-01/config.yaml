# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Provision A TeamEnvironment And Prove It Answers (LAB). Graded against the live cluster. Needs outbound
# internet: Crossplane pulls providers and functions from xpkg.crossplane.io.
apiVersion: astrona.io/v1
metadata:
  name: ats-019-lab-030-03
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - xpkg.crossplane.io/crossplane/crossplane:v2.4.2
      - ghcr.io/stefanprodan/podinfo:6.15.0

bootstrap:
  init:
    - name: install-crossplane
      description: "Installs Crossplane 2.4.2 in crossplane-system and waits for its CRDs"
      type: file
      source: bootstrap/01-install-crossplane.sh
    - name: install-platform-api
      description: "Installs provider-kubernetes, the function, the ProviderConfig, its RBAC and the TeamEnvironment XRD"
      type: file
      source: bootstrap/02-install-platform-api.sh
    - name: install-crossplane-cli
      description: "Downloads the crossplane CLI 2.4.1 into the lab work folder"
      type: file
      source: bootstrap/03-install-crossplane-cli.sh
  manifests:
    - name: shuttle
      type: file
      source: manifests/shuttle.yaml
    - name: composition-teamenvironment
      type: file
      source: manifests/composition-teamenvironment.yaml
  waitFor:
    - resource: deployment/shuttle
      namespace: outpost
      condition: Available
      timeout: 180s

testing:
  init:
    - name: verify-unfinished-state
      description: Require a ready API and an explicit grader rejection before solving
      type: file
      source: testing/verify-start.sh
      timeout: 10m
    - name: solution
      description: "Reference solution applied by astrona test"
      type: file
      source: solution/apply.sh

validation:
  passPercent: 100
  scripts:
    - name: request
      description: "A TeamEnvironment scout-env exists in outpost with the requested values"
      type: file
      source: validation/validate-request.sh
      points: 20
    - name: ready
      description: "The request is Synced and Ready"
      type: file
      source: validation/validate-ready.sh
      points: 25
    - name: composed-resources
      description: "Crossplane composed two Object resources and both are Ready"
      type: file
      source: validation/validate-composed-resources.sh
      points: 25
    - name: workload
      description: "The scout Deployment follows the request"
      type: file
      source: validation/validate-workload.sh
      points: 15
    - name: answers
      description: "scout answers 200 to a request from shuttle"
      type: file
      source: validation/validate-workload-answers.sh
      points: 15

teardown:
  keepCluster: false
