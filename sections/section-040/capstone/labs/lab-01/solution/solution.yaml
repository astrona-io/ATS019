# Reference end state for the capstone. Applied only by `astrona test`.
# 1. Tenant RBAC: the group outpost-team may file and read TeamEnvironments in outpost.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: teamenvironment-requester
  namespace: outpost
rules:
  - apiGroups: ["platform.starfleet.io"]
    resources: ["teamenvironments"]
    verbs: ["create", "get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: outpost-team-teamenvironment-requester
  namespace: outpost
subjects:
  - kind: Group
    name: outpost-team
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: teamenvironment-requester
  apiGroup: rbac.authorization.k8s.io
---
# 2. Workflow RBAC: provisioner creates a TeamEnvironment and waits for it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: provisioner-teamenvironment
  namespace: outpost
rules:
  - apiGroups: ["platform.starfleet.io"]
    resources: ["teamenvironments"]
    verbs: ["get", "list", "watch", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: provisioner-teamenvironment
  namespace: outpost
subjects:
  - kind: ServiceAccount
    name: provisioner
    namespace: starfleet
roleRef:
  kind: Role
  name: provisioner-teamenvironment
  apiGroup: rbac.authorization.k8s.io
---
# 3. The WorkflowTemplate with one resource step that waits for available replicas.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: request-environment
  namespace: starfleet
spec:
  entrypoint: request
  serviceAccountName: provisioner
  arguments:
    parameters:
      - name: team
  templates:
    - name: request
      resource:
        action: create
        successCondition: status.availableReplicas > 0
        manifest: |
          apiVersion: platform.starfleet.io/v1alpha1
          kind: TeamEnvironment
          metadata:
            name: {{workflow.parameters.team}}
            namespace: outpost
          spec:
            team: {{workflow.parameters.team}}
---
# 4. The Sensor ServiceAccount may create Workflows in starfleet and nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sensor-workflows
  namespace: starfleet
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflows"]
    verbs: ["create", "get", "list", "watch"]
  - apiGroups: ["argoproj.io"]
    resources: ["workflowtemplates"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sensor-workflows
  namespace: starfleet
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sensor-workflows
subjects:
  - kind: ServiceAccount
    name: operate-workflow-sa
    namespace: starfleet
---
# 5. The EventSource listens on the endpoint the tenants use.
apiVersion: argoproj.io/v1alpha1
kind: EventSource
metadata:
  name: provision
  namespace: starfleet
spec:
  service:
    ports:
      - port: 12000
        targetPort: 12000
  webhook:
    request:
      port: "12000"
      endpoint: /provision
      method: POST
---
# 6. The Sensor filters on body.tier and copies body.team into the team parameter.
apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: provision
  namespace: starfleet
spec:
  template:
    serviceAccountName: operate-workflow-sa
  dependencies:
    - name: request-dep
      eventSourceName: provision
      eventName: request
      filters:
        data:
          - path: body.tier
            type: string
            value:
              - standard
              - premium
  triggers:
    - template:
        name: submit-request-environment
        argoWorkflow:
          operation: submit
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: request-environment-
              spec:
                serviceAccountName: provisioner
                arguments:
                  parameters:
                    - name: team
                      value: unset
                workflowTemplateRef:
                  name: request-environment
          parameters:
            - src:
                dependencyName: request-dep
                dataKey: body.team
              dest: spec.arguments.parameters.0.value
