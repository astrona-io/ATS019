apiVersion: v1
kind: Namespace
metadata:
  name: outpost
---
# Client pod in the tenant namespace: it checks that the scout Service answers.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shuttle
  namespace: outpost
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shuttle
  template:
    metadata:
      labels:
        app: shuttle
    spec:
      containers:
        - name: shuttle
          image: curlimages/curl:8.22.0
          command: ["sh", "-c", "while true; do sleep 3600; done"]
