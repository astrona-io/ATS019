apiVersion: v1
kind: Namespace
metadata:
  name: starfleet
---
# In Argo Workflows 4.x the executor in every step pod writes its result into a
# WorkflowTaskResult object. The default ServiceAccount needs create and patch.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workflow-executor
  namespace: starfleet
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflowtaskresults"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workflow-executor
  namespace: starfleet
subjects:
  - kind: ServiceAccount
    name: default
    namespace: starfleet
roleRef:
  kind: Role
  name: workflow-executor
  apiGroup: rbac.authorization.k8s.io
