apiVersion: v1
kind: Namespace
metadata:
  name: starfleet
---
apiVersion: v1
kind: Namespace
metadata:
  name: outpost
---
# The identity the provisioning workflows use. It has no permission in outpost.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: provisioner
  namespace: starfleet
---
# In Argo Workflows 4.x the executor in every step pod writes its result into a
# WorkflowTaskResult object. Both ServiceAccounts need create and patch for that.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workflow-executor
  namespace: starfleet
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflowtaskresults"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workflow-executor
  namespace: starfleet
subjects:
  - kind: ServiceAccount
    name: default
    namespace: starfleet
  - kind: ServiceAccount
    name: provisioner
    namespace: starfleet
roleRef:
  kind: Role
  name: workflow-executor
  apiGroup: rbac.authorization.k8s.io
---
# The platform API object. No controller acts on it. The grader plays the controller.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: teamenvironments.platform.starfleet.io
spec:
  group: platform.starfleet.io
  scope: Namespaced
  names:
    kind: TeamEnvironment
    plural: teamenvironments
    singular: teamenvironment
    shortNames:
      - teamenv
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Team
          type: string
          jsonPath: .spec.team
        - name: Size
          type: string
          jsonPath: .spec.size
        - name: Replicas
          type: integer
          jsonPath: .spec.replicas
        - name: Phase
          type: string
          jsonPath: .status.phase
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - team
              properties:
                team:
                  type: string
                  minLength: 1
                size:
                  type: string
                  enum: ["small", "medium", "large"]
                  default: small
                replicas:
                  type: integer
                  minimum: 1
                  maximum: 3
                  default: 1
                contact:
                  type: string
            status:
              type: object
              properties:
                phase:
                  type: string
