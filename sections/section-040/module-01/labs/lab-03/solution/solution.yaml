apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: provisioner-teamenvironment
  namespace: outpost
rules:
  - apiGroups: ["platform.starfleet.io"]
    resources: ["teamenvironments"]
    verbs: ["get", "list", "watch", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: provisioner-teamenvironment
  namespace: outpost
subjects:
  - kind: ServiceAccount
    name: provisioner
    namespace: starfleet
roleRef:
  kind: Role
  name: provisioner-teamenvironment
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: request-environment
  namespace: starfleet
spec:
  entrypoint: request
  serviceAccountName: provisioner
  arguments:
    parameters:
      - name: name
        value: outpost-env
      - name: team
        value: outpost
  templates:
    - name: request
      resource:
        action: create
        successCondition: status.phase == Ready
        failureCondition: status.phase == Failed
        manifest: |
          apiVersion: platform.starfleet.io/v1alpha1
          kind: TeamEnvironment
          metadata:
            name: {{workflow.parameters.name}}
            namespace: outpost
          spec:
            team: {{workflow.parameters.team}}
            replicas: 1
