# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Trigger Workflows From Events With Argo Events (PLAYGROUND) — playground
# environment. A clean sandbox: Argo Workflows 4.1.5 and Argo Events 1.9.11
# are running. The namespace `starfleet` has the client pod `shuttle`, the
# WorkflowTemplate `provision-environment` and a ServiceAccount for the Sensor
# with no permissions. No EventBus, EventSource or Sensor exists. No task, no
# grading, no `astrona submit`. Needs outbound internet access.
apiVersion: astrona.io/v1
metadata:
  name: ats-019-playground-040-02
  docs:
    guide: docs/overview.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - quay.io/argoproj/workflow-controller:v4.1.5
      - quay.io/argoproj/argoexec:v4.1.5
      - quay.io/argoproj/argo-events:v1.9.11

bootstrap:
  init:
    - name: install-argo
      description: "Installs Argo Workflows 4.1.5 and Argo Events 1.9.11 and waits for both controllers"
      type: file
      source: bootstrap/01-install-argo.sh
  manifests:
    - name: starfleet-base
      type: file
      source: manifests/starfleet-base.yaml
  waitFor:
    - resource: deploy/workflow-controller
      namespace: argo
      timeout: 240s
    - resource: deploy/controller-manager
      namespace: argo-events
      timeout: 240s
    - resource: deploy/shuttle
      namespace: starfleet
      timeout: 180s

teardown:
  keepCluster: false
