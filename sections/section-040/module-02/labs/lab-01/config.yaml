# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Trigger A Provisioning Workflow From A Webhook (LAB). Argo Workflows and Argo Events run. The namespace starfleet has the client pod shuttle, the WorkflowTemplate provision-environment and a Sensor ServiceAccount with no permissions. The reader builds the EventBus, the webhook EventSource and the Sensor.
# Needs outbound internet access: the bootstrap downloads the Argo Workflows
# and Argo Events release manifests from GitHub.
apiVersion: astrona.io/v1
metadata:
  name: ats-019-lab-040-02
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - quay.io/argoproj/workflow-controller:v4.1.5
      - quay.io/argoproj/argoexec:v4.1.5
      - quay.io/argoproj/argo-events:v1.9.11

bootstrap:
  init:
    - name: install-argo
      description: "Installs Argo Workflows 4.1.5 and Argo Events 1.9.11 and waits for both controllers"
      type: file
      source: bootstrap/01-install-argo.sh
  manifests:
    - name: starfleet-base
      type: file
      source: manifests/starfleet-base.yaml
  waitFor:
    - resource: deploy/workflow-controller
      namespace: argo
      timeout: 240s
    - resource: deploy/controller-manager
      namespace: argo-events
      timeout: 240s
    - resource: deploy/shuttle
      namespace: starfleet
      timeout: 180s

testing:
  init:
    - name: verify-unfinished-state
      description: Require a ready API and an explicit grader rejection before solving
      type: file
      source: testing/verify-start.sh
      timeout: 10m
    - name: apply-reference-solution
      type: file
      source: solution/apply.sh

validation:
  passPercent: 100
  script:
    name: eventsource
    type: file
    source: validation/validate-01-eventsource.sh
    points: 20
  scripts:
    - name: rbac
      type: file
      source: validation/validate-02-sensor-rbac.sh
      points: 20
    - name: workflow-from-event
      type: file
      source: validation/validate-03-workflow-from-event.sh
      points: 20
    - name: filter
      type: file
      source: validation/validate-04-filter.sh
      points: 20
    - name: workflow-succeeds
      type: file
      source: validation/validate-05-workflow-succeeds.sh
      points: 20
teardown:
  keepCluster: false
