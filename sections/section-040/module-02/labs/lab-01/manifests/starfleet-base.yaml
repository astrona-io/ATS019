apiVersion: v1
kind: Namespace
metadata:
  name: starfleet
---
# Client pod: requests are sent from here with `kubectl exec deploy/shuttle -- curl ...`
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shuttle
  namespace: starfleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shuttle
  template:
    metadata:
      labels:
        app: shuttle
    spec:
      containers:
        - name: shuttle
          image: curlimages/curl:8.22.0
          command: ["sh", "-c", "while true; do sleep 3600; done"]
---
# Identity of the pods that run the steps of a Workflow. It may only report
# step results back to Argo Workflows.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: provisioner
  namespace: starfleet
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: provisioner-taskresults
  namespace: starfleet
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflowtaskresults"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: provisioner-taskresults
  namespace: starfleet
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: provisioner-taskresults
subjects:
  - kind: ServiceAccount
    name: provisioner
    namespace: starfleet
---
# Identity of the Sensor pod. It has no Role on purpose: it cannot create
# Workflows until the reader grants that permission.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: operate-workflow-sa
  namespace: starfleet
---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: provision-environment
  namespace: starfleet
spec:
  entrypoint: main
  serviceAccountName: provisioner
  arguments:
    parameters:
      - name: team
  templates:
    - name: main
      container:
        image: curlimages/curl:8.22.0
        command: ["sh", "-c"]
        args: ["echo \"provisioning environment for {{workflow.parameters.team}}\""]
