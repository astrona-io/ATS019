apiVersion: apps/v1
kind: Deployment
metadata:
  name: shuttle
  namespace: outpost
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shuttle
  template:
    metadata:
      labels:
        app: shuttle
    spec:
      containers:
        - name: shuttle
          image: curlimages/curl:8.22.0
          command: ["sleep", "86400"]
