apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: teamenvironment-edit
  labels:
    rbac.authorization.k8s.io/aggregate-to-edit: 'true'
rules:
- apiGroups:
  - platform.starfleet.io
  resources:
  - teamenvironments
  verbs:
  - create
  - get
  - list
  - watch
  - update
  - patch
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: teamenvironment-view
  labels:
    rbac.authorization.k8s.io/aggregate-to-view: 'true'
rules:
- apiGroups:
  - platform.starfleet.io
  resources:
  - teamenvironments
  verbs:
  - get
  - list
  - watch
