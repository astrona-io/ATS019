schema_version: 1
kind: question_bank
id: ats019-final
course_id: ATS019
exam_code: CNPE
status: draft
provenance: Original practice material; not official exam questions.
scope:
  type: domain
  id: platform-apis-and-self-service-capabilities
  title: "Platform APIs and Self-Service Capabilities"
placement:
  position: after
  reading: sections/section-040/capstone/labs/lab-01/question.md
questions:
  - id: ats019-final-q01
    type: single_choice
    difficulty: intermediate
    learning_objective: "Predict the API server result for a value outside an enum."
    source_readings:
      - sections/section-010/module-01/course-02-types-defaults-and-pruning.md
      - sections/section-030/module-02/course-01-from-a-crd-to-an-xrd.md
    prompt: "A tenant in `outpost` applies a `TeamEnvironment` with `size: huge`. The XRD schema allows only `small`, `medium` and `large` for `size`. What happens?"
    options:
      - id: a
        text: "The object is stored, and the Composition lowers `size` to `large`."
        explanation: "The API server does not store the object, and the Composition never sees it, so nothing lowers the value."
      - id: b
        text: "The API server refuses the object with a schema error. Nothing is stored, so no Composition, workflow or provider acts on it."
        explanation: "Correct. The API server checks the schema on write and refuses the object, so no controller acts on it."
      - id: c
        text: "The object is stored with `Ready False`, and Crossplane reports the error in the conditions."
        explanation: "A refused request stores no object, so there are no conditions to read."
      - id: d
        text: "The object is stored, and `provider-kubernetes` refuses to create the Deployment."
        explanation: "The object is never stored, so the provider never receives it."
    correct_option: b
    explanation: "The API server checks every write against the OpenAPI v3 schema before any controller sees the object. A refused request creates no object, so there is no status to read. The error is in the `kubectl` output."

  - id: ats019-final-q02
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain pruning for a client without strict validation."
    source_readings:
      - sections/section-010/module-01/course-02-types-defaults-and-pruning.md
    prompt: "A CRD has a structural schema with a declared `spec.replicas` field. A client without strict field validation (`kubectl apply --validate=false`) sends an object with the field `spec.replcas: 3`. What does the API server do?"
    options:
      - id: a
        text: "It refuses the object with a `strict decoding error`."
        explanation: "The strict decoding error appears only when the client asks for strict validation, and this client does not."
      - id: b
        text: "It stores `replcas` exactly as written."
        explanation: "The schema does not declare the field, so the API server drops it instead of storing it."
      - id: c
        text: "It renames `replcas` to `replicas`."
        explanation: "The API server never renames fields."
      - id: d
        text: "It prunes `replcas` without an error and stores the rest of the object."
        explanation: "Correct. Pruning drops the undeclared field without an error and stores the rest."
    correct_option: d
    explanation: "Pruning drops every field that the schema does not declare. The error appears only when the client asks for strict validation, which `kubectl` does by default. A schema with `x-kubernetes-preserve-unknown-fields: true` would keep the field."

  - id: ats019-final-q03
    type: single_choice
    difficulty: intermediate
    learning_objective: "Choose the request that writes status only."
    source_readings:
      - sections/section-010/module-02/course-03-status-subresource.md
    prompt: "A controller must write `status.phase` on a `TeamEnvironment` without changing `spec`. The CRD enables the `status` subresource. Which request does this?"
    options:
      - id: a
        text: "A request to the `/status` endpoint, for example `kubectl patch --subresource=status`."
        explanation: "Correct. With the subresource enabled, only the /status endpoint changes status."
      - id: b
        text: "A normal `kubectl apply` of a manifest that contains `status.phase`."
        explanation: "With the subresource enabled, the normal endpoint ignores status."
      - id: c
        text: "A `kubectl scale` request."
        explanation: "A scale request changes the replica count, not status.phase."
      - id: d
        text: "A normal `kubectl edit` that changes `spec` and `status` together."
        explanation: "The normal endpoint ignores the status part of the change."
    correct_option: a
    explanation: "With the subresource enabled, the normal endpoint ignores `status`. Only the `/status` endpoint changes it, and that endpoint ignores changes to `spec`. This keeps a tenant's `spec` update from overwriting what the controller reports."

  - id: ats019-final-q04
    type: single_choice
    difficulty: advanced
    learning_objective: "Predict which version kubectl uses without a version."
    source_readings:
      - sections/section-010/module-02/course-01-served-and-storage-versions.md
    prompt: "A CRD serves `v1alpha1` and `v1`, and `v1` is the storage version. The CRD lists `v1alpha1` first. A user runs `kubectl get teamenvironments`, with no version in the resource name. Which version does the API server use?"
    options:
      - id: a
        text: "`v1alpha1`, because it is first in the CRD."
        explanation: "The order of versions in the CRD does not choose the preferred version."
      - id: b
        text: "The storage version only, because `kubectl get` reads from etcd."
        explanation: "The storage version only sets how objects are written to etcd, not which version kubectl asks for."
      - id: c
        text: "`v1`, because the group's preferred version comes from version priority, and `v1` ranks before `v1alpha1`."
        explanation: "Correct. The preferred version follows version priority, and v1 ranks before v1alpha1."
      - id: d
        text: "Both versions, with one table for each."
        explanation: "kubectl asks for one version and shows one table."
    correct_option: c
    explanation: "The preferred version of a group follows version priority, not the order of the list in the CRD. A client that needs one exact version writes it in the resource name, for example `teamenvironments.v1alpha1.platform.starfleet.io`."

  - id: ats019-final-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain what the scale subresource changes."
    source_readings:
      - sections/section-010/module-02/course-04-scale-subresource.md
    prompt: "A CRD enables the `scale` subresource with `specReplicasPath: .spec.replicas`. A platform engineer runs `kubectl scale teamenvironment alpha --replicas=3`. What changes in the cluster?"
    options:
      - id: a
        text: "The API server creates three pods."
        explanation: "The scale endpoint runs no workload and creates no pods."
      - id: b
        text: "The API server changes `status.readyReplicas` to 3."
        explanation: "The scale endpoint writes the spec path, not a status field."
      - id: c
        text: "The API server writes `spec.replicas: 3`. A controller must still react and create the workload."
        explanation: "Correct. It writes the field named in the CRD, and a controller must still create the workload."
      - id: d
        text: "The API server changes the Deployment that the object owns."
        explanation: "The endpoint only writes the field named in the CRD and does not touch other objects."
    correct_option: c
    explanation: "The scale endpoint only reads and writes the fields named in the CRD, after a check against the schema. It runs no workload. The object is a request, and a controller or Composition turns the new count into running pods."

  - id: ats019-final-q06
    type: single_choice
    difficulty: advanced
    learning_objective: "Predict the order of schema checks and CEL rules."
    source_readings:
      - sections/section-010/module-01/course-03-cel-rules.md
    prompt: "A CRD schema allows `replicas` up to 5. It also has this CEL rule on `spec`: `self.size != 'small' || self.replicas <= 2`. A user applies an object with `size: small` and `replicas: 4`. What does the user see?"
    options:
      - id: a
        text: "The API server passes the schema checks and then refuses the object because the CEL rule is false."
        explanation: "Correct. The schema allows 4, so the checks pass and the false CEL rule refuses the request."
      - id: b
        text: "The API server accepts the object, because `replicas` is below the schema maximum."
        explanation: "The schema maximum is not the only check, and the CEL rule is false for this object."
      - id: c
        text: "The API server refuses the object with a schema error, and it skips the CEL rule."
        explanation: "The schema checks pass here, so the CEL rule is not skipped."
      - id: d
        text: "The API server changes `replicas` to 2."
        explanation: "The API server never changes a value to satisfy a rule."
    correct_option: a
    explanation: "The schema allows 4, so the schema checks pass and the API server runs the CEL rule. The rule is false for this object, so the request is refused with the message of the rule. CEL rules are skipped only when the schema checks fail first."

  - id: ats019-final-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: "Name the component that deletes owned objects."
    source_readings:
      - sections/section-020/module-02/course-01-owner-references-and-garbage-collection.md
    prompt: "A tenant deletes a `Prometheus` resource. The Prometheus Operator in this course adds no finalizer to it. Which component removes the StatefulSet that the operator created for it?"
    options:
      - id: a
        text: "The Prometheus Operator, which runs cleanup code during the delete request."
        explanation: "The operator adds no finalizer here, so it runs no cleanup during the delete request."
      - id: b
        text: "The API server, which deletes every object in the same namespace."
        explanation: "The API server does not delete every object in the namespace."
      - id: c
        text: "The StatefulSet controller, because the StatefulSet has no pods left."
        explanation: "The StatefulSet controller does not delete its own object."
      - id: d
        text: "The garbage collector, which follows the `ownerReference` from the StatefulSet to the deleted `Prometheus` resource."
        explanation: "Correct. The garbage collector follows the ownerReference and deletes the dependent."
    correct_option: d
    explanation: "The operator marks the `Prometheus` resource as the owner of the objects it creates. When the owner is gone, the garbage collector deletes the dependents. This works even if the operator is not running."

  - id: ats019-final-q08
    type: single_choice
    difficulty: beginner
    learning_objective: "Order the steps of a reconcile loop."
    source_readings:
      - sections/section-020/module-01/course-02-follow-a-custom-resource.md
    prompt: "Which list shows the steps of a reconcile loop in the correct order?"
    options:
      - id: a
        text: "Write status, act on the difference, read actual state, read desired state."
        explanation: "Status is written last, after the controller acts."
      - id: b
        text: "Read desired state, read actual state, act on the difference, write status."
        explanation: "Correct. The controller reads desired state, reads actual state, acts on the difference and writes status."
      - id: c
        text: "Act on the difference, read desired state, write status, read actual state."
        explanation: "The controller must read both states before it acts."
      - id: d
        text: "Read actual state, write status, read desired state, act on the difference."
        explanation: "The controller writes status after it acts, not before."
    correct_option: b
    explanation: "A controller compares what the custom resource asks for with what exists. It changes the cluster only where the two differ, and it reports the result in `status`. It repeats the cycle on every watch event."

  - id: ats019-final-q09
    type: single_choice
    difficulty: intermediate
    learning_objective: "Order events in foreground cascading deletion."
    source_readings:
      - sections/section-020/module-02/course-02-cascading-deletion-modes.md
    prompt: "A `TeamEnvironment` owns a ConfigMap through an `ownerReference`. An engineer deletes it with `kubectl delete teamenvironment alpha --cascade=foreground`. What is the order of events?"
    options:
      - id: a
        text: "The garbage collector deletes the dependent ConfigMap first, and the owner is removed after that."
        explanation: "Correct. Foreground deletion removes the dependents before the owner."
      - id: b
        text: "The owner is removed first, and the ConfigMap is removed later."
        explanation: "Removing the owner first is background deletion."
      - id: c
        text: "The ConfigMap is orphaned, and only the owner is removed."
        explanation: "Keeping the dependents is orphan deletion, not foreground."
      - id: d
        text: "Nothing is deleted until the engineer removes the ConfigMap by hand."
        explanation: "The garbage collector deletes the dependents without a manual step."
    correct_option: a
    explanation: "Foreground deletion removes the dependents before the owner. Background deletion removes the owner first. Orphan deletion removes the owner and keeps the dependents."

  - id: ats019-final-q10
    type: single_choice
    difficulty: intermediate
    learning_objective: "Read the fields that hold a deletion."
    source_readings:
      - sections/section-020/module-02/course-03-finalizers-and-deletion-timestamp.md
    prompt: "An engineer runs `kubectl delete configmap scout-settings --wait=false`. The object stays. Which two fields of the object show why?"
    options:
      - id: a
        text: "`metadata.generation` and `status.conditions`."
        explanation: "generation and conditions do not show a pending deletion."
      - id: b
        text: "`metadata.labels` and `metadata.annotations`."
        explanation: "Labels and annotations do not show a pending deletion."
      - id: c
        text: "`spec.replicas` and `status.phase`."
        explanation: "spec and status.phase do not show a pending deletion, and a ConfigMap has neither."
      - id: d
        text: "`metadata.deletionTimestamp` and `metadata.finalizers`."
        explanation: "Correct. deletionTimestamp is set and the finalizers list still holds a name."
    correct_option: d
    explanation: "The API server sets `deletionTimestamp` when it accepts the delete request. The object stays while `finalizers` still lists a name. The component that owns that name must do its cleanup and remove it. The next step is to find that component, not to remove the name by hand."

  - id: ats019-final-q11
    type: single_choice
    difficulty: intermediate
    learning_objective: "Find the cause when an object has no status."
    source_readings:
      - sections/section-020/module-01/course-04-find-why-a-reconcile-failed.md
    prompt: "A tenant applies a custom resource that the API server accepts. Minutes later it has no `status.conditions`, no child objects and no events. Other custom resources of the same kind behave the same way. What is the most likely cause?"
    options:
      - id: a
        text: "The CRD schema is wrong, because the API server accepted the object."
        explanation: "The API server accepted the object, so the schema is not the fault."
      - id: b
        text: "No controller is running, or it cannot start, so nothing acts on the object. Check the controller Deployment and its logs."
        explanation: "Correct. Without a running controller, nothing acts on the object."
      - id: c
        text: "The tenant needs the `edit` ClusterRole to see conditions."
        explanation: "Reading conditions does not need the edit ClusterRole, and the conditions are empty."
      - id: d
        text: "The garbage collector has not run yet."
        explanation: "The garbage collector deletes objects and does not write conditions."
    correct_option: b
    explanation: "A CRD only adds a kind to the API server. A controller must read the objects, build the child objects and write conditions. When the status is empty for every object of the kind, check the controller first."

  - id: ats019-final-q12
    type: single_choice
    difficulty: intermediate
    learning_objective: "Write the user name of a ServiceAccount."
    source_readings:
      - sections/section-020/module-01/course-04-find-why-a-reconcile-failed.md
      - sections/section-040/module-03/course-01-scope-a-tenant-with-a-role-and-rolebinding.md
    prompt: "An administrator wants to test what the Prometheus Operator may do. Its pod runs in the namespace `default` with the ServiceAccount `prometheus-operator`. Which `--as` value does `kubectl auth can-i` need?"
    options:
      - id: a
        text: "`--as=prometheus-operator`"
        explanation: "A bare name is not a ServiceAccount user name."
      - id: b
        text: "`--as=serviceaccount:prometheus-operator:default`"
        explanation: "The namespace and name are in the wrong order and the prefix is missing the system: part."
      - id: c
        text: "`--as=system:serviceaccount:default:prometheus-operator`"
        explanation: "Correct. The form is system:serviceaccount:<namespace>:<name>."
      - id: d
        text: "`--as=system:node:default`"
        explanation: "This is a node identity, not a ServiceAccount."
    correct_option: c
    explanation: "The name of a ServiceAccount user is `system:serviceaccount:<namespace>:<name>`. The check uses the real RBAC rules, so it shows what the controller can do in the cluster. The same form works for any pod identity, such as a provider or a workflow."

  - id: ats019-final-q13
    type: single_choice
    difficulty: advanced
    learning_objective: "Fix a forbidden error on a composed object."
    source_readings:
      - sections/section-030/module-01/course-03-managed-resources-and-failed-syncs.md
      - sections/section-030/module-03/course-03-read-a-failing-composite-resource.md
    prompt: "A `TeamEnvironment` passes the schema and shows `SYNCED True` and `READY False`. `crossplane resource trace` shows one `Object` for a Service with `Synced False`. Its message ends with a `forbidden` error for `system:serviceaccount:crossplane-system:provider-kubernetes` on `services` in `outpost`. What is the correct fix?"
    options:
      - id: a
        text: "Edit the `TeamEnvironment` and remove the Service from `spec`."
        explanation: "Removing the Service from spec does not fix the missing permission."
      - id: b
        text: "Bind `cluster-admin` to the ServiceAccount of the provider."
        explanation: "This works but gives the provider far more power than it needs."
      - id: c
        text: "Delete the `Object` and wait for the XR to fix itself."
        explanation: "Deleting the Object does not change the permission, so the error returns."
      - id: d
        text: "Create a Role for `services` in `outpost` and bind it to the provider ServiceAccount."
        explanation: "Correct. A Role limited to services in outpost fixes the error with least privilege."
    correct_option: d
    explanation: "The ProviderConfig worked, because the request reached the API server as the provider identity. The API server refused it for lack of RBAC. Grant only the verbs on the kind in that namespace. Option B works but gives a provider far more power than it needs."

  - id: ats019-final-q14
    type: single_choice
    difficulty: intermediate
    learning_objective: "Check a missing function reference."
    source_readings:
      - sections/section-030/module-02/course-04-render-and-debug-a-composition.md
    prompt: "A Composition pipeline step has `functionRef.name: function-patch-and-transform`. The XR shows `Synced False` with a `ReconcileError` that names a missing function. Which check finds the cause?"
    options:
      - id: a
        text: "Run `kubectl get functions` and compare the name of the installed `Function` object with `functionRef.name`."
        explanation: "Correct. The functionRef.name must match an installed Function object."
      - id: b
        text: "Run `kubectl get providers` and read the `HEALTHY` column."
        explanation: "Providers are not functions, so this does not show the missing function."
      - id: c
        text: "Run `kubectl get crd` and look for the XRD."
        explanation: "The XRD is not the fault, because the XR was accepted."
      - id: d
        text: "Run `kubectl auth can-i` for the tenant."
        explanation: "RBAC does not explain a missing function."
    correct_option: a
    explanation: "The `functionRef.name` must equal the name of the installed `Function` object, not the package address. The API server accepts a Composition that names a missing function, because it checks only the shape. The error appears when Crossplane runs the pipeline."

  - id: ats019-final-q15
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain why render needs a container runtime."
    source_readings:
      - sections/section-030/module-02/course-04-render-and-debug-a-composition.md
    prompt: "An engineer wants to see what a Composition would create, before applying it to the cluster. The command `crossplane composition render` fails on a laptop that has no container runtime. Why does it need one?"
    options:
      - id: a
        text: "The command installs the provider on the laptop."
        explanation: "Render does not install a provider."
      - id: b
        text: "The command runs each composition function as a container on the laptop, and the function image comes from a registry."
        explanation: "Correct. Render runs each function as a container, and the image comes from a registry."
      - id: c
        text: "The command applies the XRD to a local cluster."
        explanation: "Render does not apply anything to a cluster."
      - id: d
        text: "The command checks the RBAC of the provider."
        explanation: "Render does not check RBAC."
    correct_option: b
    explanation: "Render runs the pipeline locally and prints the resources it would create. It does not change the cluster. It also does not show whether the provider has permission to create them."

  - id: ats019-final-q16
    type: single_choice
    difficulty: advanced
    learning_objective: "Choose a sound order to debug a composite resource."
    source_readings:
      - sections/section-030/module-03/course-02-trace-a-composite-resource.md
      - sections/section-030/module-03/course-03-read-a-failing-composite-resource.md
    prompt: "A composite resource is not ready. Which order of checks follows a sound method?"
    options:
      - id: a
        text: "Delete the composed objects, apply the XR again, then read the provider log."
        explanation: "Deleting the composed objects removes the evidence and does not find the fault."
      - id: b
        text: "Edit `resourceRefs` on the XR, then describe the Composition, then read the Application."
        explanation: "Crossplane owns resourceRefs and overwrites a manual edit."
      - id: c
        text: "Read the conditions of the XR, trace down to the row that is not ready, then describe that object and read its conditions and events."
        explanation: "Correct. Each step narrows the search to the component that holds the fault."
      - id: d
        text: "Restart Crossplane, then restart the provider, then read the XR."
        explanation: "A restart removes the evidence in conditions and events."
    correct_option: c
    explanation: "Each step narrows the search to the component that holds the fault. Crossplane owns `resourceRefs`, so a manual change is overwritten. A restart removes the evidence that the conditions and events hold."

  - id: ats019-final-q17
    type: single_choice
    difficulty: intermediate
    learning_objective: "Define a namespaced composite resource without claims."
    source_readings:
      - sections/section-030/module-02/course-01-from-a-crd-to-an-xrd.md
      - sections/section-030/module-03/course-01-request-a-composite-resource.md
    prompt: "A platform team wants tenants to request a `TeamEnvironment` directly in their own namespace, with no claim object. What does the team define?"
    options:
      - id: a
        text: "An XRD in `apiextensions.crossplane.io/v2` with `scope: Namespaced`."
        explanation: "Correct. In Crossplane 2.x scope: Namespaced is the default, and the tenant creates the XR directly."
      - id: b
        text: "An XRD with `scope: LegacyCluster` and a claim kind."
        explanation: "Claims exist only for scope: LegacyCluster."
      - id: c
        text: "A plain CRD, because an XRD cannot be namespaced."
        explanation: "An XRD can be namespaced, so a plain CRD is not needed."
      - id: d
        text: "A Composition with `mode: Resources`."
        explanation: "The old Resources mode is gone, and Compositions use mode: Pipeline."
    correct_option: a
    explanation: "In Crossplane 2.x a composite resource is namespaced by default, and a tenant creates it directly. Claims exist only for `scope: LegacyCluster`. The Composition still uses `mode: Pipeline`."

  - id: ats019-final-q18
    type: single_choice
    difficulty: intermediate
    learning_objective: "Read Synced and Ready on a managed resource."
    source_readings:
      - sections/section-030/module-01/course-03-managed-resources-and-failed-syncs.md
    prompt: "A managed resource shows `Synced True` and `Ready False`. What does this tell you?"
    options:
      - id: a
        text: "The provider could not connect to the cluster."
        explanation: "A connection failure gives Synced False, not Synced True."
      - id: b
        text: "The tenant has no permission to read the object."
        explanation: "Tenant permission to read the object does not set these conditions."
      - id: c
        text: "The Composition refers to a missing function."
        explanation: "A missing function is a Composition fault, not a managed resource condition."
      - id: d
        text: "The provider reconciled the resource without an error, but the external resource is not yet usable."
        explanation: "Correct. Synced True means the reconcile worked, and Ready False means the external resource is not yet usable."
    correct_option: d
    explanation: "`Synced` says whether the provider could reconcile the resource. `Ready` says whether the external resource exists and is usable. A failed reconcile gives `Synced False`, and its message says why."

  - id: ats019-final-q19
    type: single_choice
    difficulty: intermediate
    learning_objective: "Debug a failed Workflow in order."
    source_readings:
      - sections/section-040/module-01/course-04-create-a-platform-api-object-and-wait.md
      - sections/section-040/module-01/course-03-give-the-workflow-a-serviceaccount.md
    prompt: "A Workflow ends as `Failed`. What is the best order to find the cause?"
    options:
      - id: a
        text: "Read the log of the workflow controller, then restart it."
        explanation: "Restarting the controller does not show why one step failed."
      - id: b
        text: "Delete the Workflow and submit it again, then compare the result."
        explanation: "Deleting and resubmitting the Workflow removes the failed nodes you need to read."
      - id: c
        text: "Read the phase of the Workflow, find the failed node and its message, then read the log of the `main` container of that step."
        explanation: "Correct. The failed node names the step, and its main log shows the real error."
      - id: d
        text: "Read the EventBus, then the Sensor, then the EventSource."
        explanation: "The Argo Events objects are not part of a Workflow that already ran."
    correct_option: c
    explanation: "The Workflow status lists every node with its own phase and message. The failed node names the step to read. The `main` log of that pod then shows the real error, for example a `forbidden` message from the API server."

  - id: ats019-final-q20
    type: single_choice
    difficulty: beginner
    learning_objective: "State the job of an EventBus."
    source_readings:
      - sections/section-040/module-02/course-01-eventbus-and-webhook-eventsource.md
    prompt: "What does an EventBus do in Argo Events?"
    options:
      - id: a
        text: "It receives the HTTP request from the client and returns the `200`."
        explanation: "The EventSource receives the HTTP request, not the EventBus."
      - id: b
        text: "It carries the events that EventSources publish to the Sensors in the same namespace."
        explanation: "Correct. The EventBus carries events from EventSources to Sensors in the namespace."
      - id: c
        text: "It creates the Workflow from the event."
        explanation: "The Sensor trigger creates the Workflow, not the EventBus."
      - id: d
        text: "It filters events with a data filter."
        explanation: "The Sensor applies filters, not the EventBus."
    correct_option: b
    explanation: "The EventSource receives the request and publishes the event. The Sensor reads it from the EventBus, applies its filter and runs the trigger. Without an EventBus, the EventSource and the Sensor cannot pass events."

  - id: ats019-final-q21
    type: single_choice
    difficulty: advanced
    learning_objective: "Read a forbidden result as correct tenant scope."
    source_readings:
      - sections/section-040/module-03/course-01-scope-a-tenant-with-a-role-and-rolebinding.md
    prompt: "A tenant in the group `outpost-team` can create and read `teamenvironments` in `outpost`. The same tenant runs `kubectl -n outpost create deployment web --image=nginx` and gets `forbidden`. How should the platform team read this?"
    options:
      - id: a
        text: "As a fault. The platform team must add `create` on `deployments` to the Role."
        explanation: "The tenant needs no rights on Deployments, so adding create would give too much access."
      - id: b
        text: "As a fault in the AppProject, because it blocks Deployments."
        explanation: "The AppProject is not involved in a direct kubectl request."
      - id: c
        text: "As a fault in the Composition, because it should have created the Deployment for the tenant."
        explanation: "The Composition builds the Deployment with its own identity, not the tenant's."
      - id: d
        text: "As the correct result. The Role allows only the platform API kind. The Composition and the provider create the Deployment with their own identities."
        explanation: "Correct. The Role allows only the platform API kind, so forbidden on deployments is the expected result."
    correct_option: d
    explanation: "A tenant that asks only for a `TeamEnvironment` needs no rights on Deployments or Secrets. The proof has two parts: `kubectl auth can-i create teamenvironments.platform.starfleet.io` is `yes`, and `create deployments.apps` is `no`. Giving the tenant the built-in `edit` ClusterRole would also let it read Secrets."

  - id: ats019-final-q22
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain aggregated ClusterRoles."
    source_readings:
      - sections/section-040/module-03/course-02-aggregate-platform-api-permissions.md
    prompt: "The platform team creates a ClusterRole with the label `rbac.authorization.k8s.io/aggregate-to-view: \"true\"` and a rule that allows `get`, `list` and `watch` on `teamenvironments`. Who gets read access to `teamenvironments` without a new binding?"
    options:
      - id: a
        text: "Only the members of the group `outpost-team`."
        explanation: "The label adds rules to a built-in role, not to a group."
      - id: b
        text: "Every user in the cluster."
        explanation: "The rules go into view, so only subjects that hold view gain access."
      - id: c
        text: "Every subject that already holds the built-in `view` ClusterRole, because the control plane copies the rules into it."
        explanation: "Correct. The control plane copies the labelled rules into the view ClusterRole."
      - id: d
        text: "Nobody, because a built-in ClusterRole cannot receive new rules."
        explanation: "Built-in aggregated roles can receive new rules through this label."
    correct_option: c
    explanation: "The built-in `view` ClusterRole is an aggregated role. A controller in the control plane adds the rules of every ClusterRole that carries its label. Use this to extend built-in roles for the platform's own users."

  - id: ats019-final-q23
    type: single_choice
    difficulty: intermediate
    learning_objective: "Predict an AppProject destination refusal."
    source_readings:
      - sections/section-040/module-03/course-03-deliver-requests-through-git-with-argo-cd.md
    prompt: "A tenant commits a `TeamEnvironment` file with `metadata.namespace: starfleet`. The Argo CD `AppProject` of the tenant allows only the destination namespace `outpost`. What happens when Argo CD syncs the Application?"
    options:
      - id: a
        text: "Argo CD applies the object in `starfleet`, because the repository is allowed."
        explanation: "The AppProject limits destination namespaces, not only repositories."
      - id: b
        text: "Argo CD refuses the object because the destination is not allowed. The reason shows in the Application conditions, and no object is created."
        explanation: "Correct. Argo CD refuses the destination, shows the reason in the Application conditions and creates no object."
      - id: c
        text: "Argo CD applies the object in `outpost` instead."
        explanation: "Argo CD does not change the namespace of an object."
      - id: d
        text: "Argo CD creates the object and Crossplane refuses to compose it."
        explanation: "Crossplane never sees the object, because Argo CD refuses it first."
    correct_option: b
    explanation: "An AppProject limits the repositories, destination namespaces and resource kinds of its Applications. A request file therefore cannot give itself more reach than the project allows. Read the Application first when the object does not exist."

  - id: ats019-final-q24
    type: single_choice
    difficulty: advanced
    learning_objective: "Order a request from Git to a ready environment."
    source_readings:
      - sections/section-040/module-03/course-04-follow-a-request-from-commit-to-ready.md
    prompt: "A tenant commits a `TeamEnvironment` file to Git. Which order describes how the request becomes a ready environment?"
    options:
      - id: a
        text: "Argo CD syncs the file. The API server validates it against the schema. Crossplane runs the Composition and creates the composed objects. The XR reports `Ready True`."
        explanation: "Correct. Argo CD applies, the API server validates, Crossplane composes and the XR reports Ready True."
      - id: b
        text: "Crossplane reads the file from Git. Argo CD runs the Composition. The API server creates the objects."
        explanation: "Crossplane does not read Git, and Argo CD does not run the Composition."
      - id: c
        text: "The API server reads the file from Git. Argo CD validates the schema. The Sensor runs the Composition."
        explanation: "The API server does not read Git, and the Sensor does not run the Composition."
      - id: d
        text: "Argo CD runs the Composition. Crossplane syncs the file. The XR reports `Ready True` before any object exists."
        explanation: "The XR cannot be ready before the objects exist."
    correct_option: a
    explanation: "Each component has one job. Argo CD only applies what is in Git. The API server accepts or refuses the object. Crossplane builds the environment. A request can stop at any step: refused by the schema, blocked by the project or by RBAC, or accepted and never `Ready`. The `Synced` status of the Application proves only that the file reached the cluster."
